<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Grind — galerie d'animations (dev)</title>
    <style>
      :root { --fig:#e5e9f0; --fig-far:#6b7488; --fig-edge:#0f1520; --hair:#4a5263; --floor:#2a3345; --scene:#1c2433; --scene-hi:#2b3648; --sac:#334155; --sac-hi:#64748b; --anchor:#94a3b8; --mark:#67e8f9; --mark-bg:rgba(8,47,73,0.85); }
      body { background:#0a0e17; color:#cbd5e1; font:12px system-ui; margin:8px; }
      .grid { display:grid; grid-template-columns:repeat(var(--cols, 6), 1fr); gap:6px; }
      .cell { background:#111827; border-radius:6px; padding:4px; }
      .cell svg { width:100%; aspect-ratio:4/3; display:block; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gallery.tsx"></script>
  </body>
</html>
