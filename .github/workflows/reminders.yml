name: Rappels

on:
  schedule:
    # 18h30 Paris (été / hiver)
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'
    # 14h Paris le week-end ou séance déplacée un samedi (été / hiver)
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Forcer un créneau pour tester (soir / aprem)'
        default: soir

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: scripts/remind
      - run: node scripts/remind/remind.mjs
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          GIST_OWNER: ${{ github.repository_owner }}
          CRON: ${{ github.event.schedule }}
          FORCE_SLOT: ${{ github.event.inputs.slot }}
      # GitHub désactive les crons d'un dépôt sans activité depuis 60 jours : un commit vide tous les ~50 jours l'évite.
      - name: Garder le dépôt actif
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "grind-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi
